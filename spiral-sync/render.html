<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Спиральная синхронность</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
'use strict';
// 21 beads circle the centre. Bead i makes turns(i) full turns per cycle, one more than the bead
// just outside it, so they start in one line, wind into spirals and spirograph stars, and line up
// again exactly when the video loops. Every crossing of the 12 o'clock line plays the bead's note.
// Everything is a function of t mod T: frame T is frame 0, and the sound is folded the same way.
const W = 1080, H = 1920, FPS = 60, TAU = Math.PI * 2;
const T = 40;                         // one cycle = the whole video
const N = 21, K = 8;                  // beads; turns per cycle of the outermost one
const CX = 525, CY = 1040, R0 = 62, R1 = 435;
const FONT = '"Inter Display", "Inter", sans-serif';

const turns = i => K + (N - 1 - i);                    // inner beads go round more often
const radius = i => R0 + (R1 - R0) * i / (N - 1);
const angle = (i, t) => -Math.PI / 2 + TAU * turns(i) * t / T;   // clockwise from 12 o'clock
const hue = i => (28 + 300 * i / (N - 1)) % 360;       // gold at the centre round the wheel to magenta
const SCALE = [0, 3, 5, 7, 10];                        // A minor pentatonic: any pile-up stays consonant
const midiOf = i => { const j = N - 1 - i; return 45 + 12 * Math.floor(j / 5) + SCALE[j % 5]; };  // A2 at the rim, A6 in the middle
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const mod = (x, m) => ((x % m) + m) % m;
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const hsla = (h, s, l, a) => `hsla(${h},${s}%,${l}%,${a})`;
// seconds since bead i last crossed the line, and until it crosses again
const since = (i, t) => mod(turns(i) * t / T, 1) * T / turns(i);
const until = (i, t) => T / turns(i) - since(i, t);
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const grain = document.createElement('canvas');
grain.width = W; grain.height = H;
{
  const g = grain.getContext('2d'), id = g.createImageData(W, H), rng = mulberry32(5);
  for (let i = 0; i < id.data.length; i += 4) { const v = rng() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 9; }
  g.putImageData(id, 0, 0);
}
const bead = (i, t) => { const a = angle(i, t), r = radius(i); return [CX + Math.cos(a) * r, CY + Math.sin(a) * r]; };
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }

// how much of the wheel is crossing the line right now: 1 when all beads do it together
function syncLevel(t, tau = 0.14) { let s = 0; for (let i = 0; i < N; i++) s += Math.exp(-since(i, t) / tau); return s / N; }

function drawBackground(t) {
  const g = ctx.createRadialGradient(CX, CY, 20, CX, CY, 1250);
  g.addColorStop(0, '#141834'); g.addColorStop(0.5, '#0a0c1d'); g.addColorStop(1, '#030409');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // the wheel breathes a little light into the room whenever beads cross together
  const s = syncLevel(t, 0.35);
  if (s > 0.02) {
    const glow = ctx.createRadialGradient(CX, CY, 0, CX, CY, 900);
    glow.addColorStop(0, `rgba(150,140,255,${0.14 * s})`); glow.addColorStop(1, 'rgba(150,140,255,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  }
}

function drawRings(t) {
  for (let i = 0; i < N; i++) {
    const p = Math.exp(-since(i, t) / 0.3);
    ctx.strokeStyle = hsla(hue(i), 90, 62, 0.11 + 0.4 * p); ctx.lineWidth = 1.5 + 1.5 * p;
    circle(CX, CY, radius(i)); ctx.stroke();
  }
}

// the 12 o'clock line, with a little key for every ring that lights when its bead strikes it
function drawLine(t) {
  const s = syncLevel(t);
  const top = CY - R1 - 26;
  const g = ctx.createLinearGradient(0, CY, 0, top);
  g.addColorStop(0, `rgba(255,255,255,${0.05 + 0.3 * s})`); g.addColorStop(1, `rgba(255,255,255,${0.16 + 0.7 * s})`);
  ctx.strokeStyle = g; ctx.lineWidth = 2 + 6 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX, top); ctx.stroke();
  if (s > 0.05) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(190,180,255,${0.35 * s})`; ctx.lineWidth = 26 * s + 4;
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX, top); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  for (let i = 0; i < N; i++) {
    const p = Math.exp(-since(i, t) / 0.22), y = CY - radius(i), w = 7 + 9 * p;
    ctx.strokeStyle = hsla(hue(i), 95, 70 + 25 * p, 0.25 + 0.75 * p); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(CX - w, y); ctx.lineTo(CX + w, y); ctx.stroke();
  }
}

// a thread through the beads, inner to outer, with fading echoes of where it just was
function drawThread(t) {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let e = 7; e >= 0; e--) {
    const te = t - e * 0.05, a = e ? 0.28 * Math.pow(0.72, e) : 0.75;
    const pts = [];
    for (let i = 0; i < N; i++) pts.push(bead(i, te));
    for (let i = 0; i < N - 1; i++) {
      const h = (hue(i) + hue(i + 1)) / 2;
      if (e === 0) {
        ctx.strokeStyle = hsla(h, 95, 60, 0.16); ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke();
      }
      ctx.strokeStyle = hsla(h, 90, e ? 62 : 78, a); ctx.lineWidth = e ? 2 : 2.6;
      ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawBeads(t) {
  ctx.lineCap = 'round';
  for (let i = 0; i < N; i++) {
    const a = angle(i, t), r = radius(i), h = hue(i), w = TAU * turns(i) / T;
    // comet tail along the ring
    const span = Math.min(1.4, w * 0.22), seg = 9;
    for (let k = 0; k < seg; k++) {
      const a0 = a - span * (k + 1) / seg, a1 = a - span * k / seg, f = 1 - k / seg;
      ctx.strokeStyle = hsla(h, 95, 62, 0.55 * f * f); ctx.lineWidth = 2 + 6 * f;
      ctx.beginPath(); ctx.arc(CX, CY, r, a0, a1); ctx.stroke();
    }
    const [x, y] = bead(i, t), p = Math.exp(-since(i, t) / 0.13);
    const halo = ctx.createRadialGradient(x, y, 2, x, y, 30 + 30 * p);
    halo.addColorStop(0, hsla(h, 100, 70, 0.55 + 0.4 * p)); halo.addColorStop(1, hsla(h, 100, 60, 0));
    ctx.fillStyle = halo; circle(x, y, 30 + 30 * p); ctx.fill();
    ctx.fillStyle = hsla(h, 100, 82 + 18 * p, 1); circle(x, y, 7.5 * (1 + 0.7 * p)); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.75 + 0.25 * p})`; circle(x, y, 3.2 * (1 + 0.7 * p)); ctx.fill();
    // ripple left on the line
    const s = since(i, t);
    if (s < 0.6) {
      const k = s / 0.6;
      ctx.strokeStyle = hsla(h, 95, 75, 0.7 * (1 - k)); ctx.lineWidth = 2.5 * (1 - k) + 0.5;
      circle(CX, CY - r, 8 + 38 * easeOut(k)); ctx.stroke();
    }
  }
}

// the moment the whole wheel lines up: a shock ring and a beam, with a glow that gathers just before
function drawAlignment(t) {
  const u = mod(t, T), pre = Math.exp(-(T - u) / 0.7);
  if (u < 1.1) {
    const k = u / 1.1;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,245,255,${0.6 * (1 - k) * (1 - k)})`; ctx.lineWidth = 16 * (1 - k) + 2;
    circle(CX, CY, (R1 + 560) * easeOut(k)); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  const flash = Math.exp(-u / 0.1) * 0.12 + pre * 0.07;
  if (flash > 0.005) { ctx.fillStyle = `rgba(235,230,255,${flash})`; ctx.fillRect(0, 0, W, H); }
}

function label(str, x, y, size, color, weight = 900, maxW = 960) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const w = ctx.measureText(str).width;
  if (w > maxW) { size = Math.floor(size * maxW / w); ctx.font = `${weight} ${size}px ${FONT}`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(4,5,12,0.9)'; ctx.lineWidth = Math.max(8, size * 0.14); ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function drawText(t) {
  const breathe = 1 + 0.02 * Math.sin(TAU * t / (T / 8));    // period divides T, so the loop stays seamless
  ctx.save(); ctx.translate(540, 250); ctx.scale(breathe, breathe);
  label('ПОПРОБУЙ НЕ ЗАЛИПНУТЬ', 0, 0, 100, '#ffffff');
  ctx.restore();
  label('все точки снова сойдутся в линию', 540, 340, 52, '#d3d6ff', 800, 900);
}

// ---------- ad badge, lower-left corner: clear of the rings, TikTok's caption and its buttons ----------
let AD = null;   // { title, sub } when the video carries the ad
function drawDomino(x, y, w, h, tilt) {
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(tilt);
  ctx.fillStyle = '#f5f1e6'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, w * 0.24); ctx.fill();
  ctx.strokeStyle = 'rgba(28,28,38,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-w / 2 + 5, 0); ctx.lineTo(w / 2 - 5, 0); ctx.stroke();
  const s = w * 0.26, r = w * 0.095;
  ctx.fillStyle = '#1c1c26';
  const pips = (cy, list) => list.forEach(([px, py]) => { ctx.beginPath(); ctx.arc(px * s, cy + py * s, r, 0, TAU); ctx.fill(); });
  pips(-h / 4, [[-1, -1], [0, 0], [1, 1]]);                   // three
  pips(h / 4, [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]]);  // five
  ctx.restore();
}
function drawAd(t) {
  if (!AD) return;
  const x = 36, pad = 20, icon = 34, gap = 18;
  ctx.font = `900 40px ${FONT}`; const tw = ctx.measureText(AD.title).width;
  let sw = 0;
  if (AD.sub) { ctx.font = `700 22px ${FONT}`; sw = ctx.measureText(AD.sub).width; }
  const w = pad * 2 + icon + gap + Math.max(tw, sw, 110), h = AD.sub ? 106 : 82, y = 1504 - h;
  ctx.fillStyle = 'rgba(12,14,30,0.8)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5; ctx.stroke();
  const k = mod(t, T / 4) / 1.2;                       // a light sweep every 10 s, period divides the loop
  if (k < 1) {
    ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.clip();
    const sx = x - 90 + (w + 180) * k, g = ctx.createLinearGradient(sx - 70, y, sx + 70, y + h);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.restore();
  }
  drawDomino(x + pad, y + (h - 60) / 2, icon, 60, 0.09 * Math.sin(TAU * t / (T / 5)));
  const tx = x + pad + icon + gap;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `700 16px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.letterSpacing = '2px';
  ctx.fillText('РЕКЛАМА', tx, y + 27); ctx.letterSpacing = '0px';
  ctx.font = `900 40px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText(AD.title, tx, y + 66);
  if (AD.sub) { ctx.font = `700 22px ${FONT}`; ctx.fillStyle = '#c9ccf2'; ctx.fillText(AD.sub, tx, y + 94); }
}

function drawFrame(t) {
  t = mod(t, T);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBackground(t);
  drawRings(t);
  drawLine(t);
  drawThread(t);
  drawBeads(t);
  drawAlignment(t);
  drawText(t);
  drawAd(t);
  ctx.drawImage(grain, 0, 0);
}

// ---------- sound ----------
// Rendered with a lead-in of the previous cycle and cut to exactly one cycle, so reverb tails and the
// compressor carry over the loop point just as they would if the video played forever.
async function renderAudio() {
  const SR = 48000, LEAD = 6;
  const ac = new OfflineAudioContext(2, Math.ceil(SR * (LEAD + T)), SR);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -20; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.3;
  comp.connect(ac.destination);
  const master = ac.createGain(); master.gain.value = 0.5; master.connect(comp);
  const verb = ac.createConvolver(); verb.buffer = makeIR(ac, 3.4);
  const wet = ac.createGain(); wet.gain.value = 0.42; verb.connect(wet); wet.connect(comp);
  const noise = makeNoise(ac, 4);
  const at = t => LEAD + t;                    // cycle time → buffer time

  function bus(pan, send) {
    const g = ac.createGain(), p = ac.createStereoPanner();
    p.pan.value = pan; g.connect(p); p.connect(master);
    const s = ac.createGain(); s.gain.value = send; p.connect(s); s.connect(verb);
    return g;
  }
  function partial(dest, f, t, peak, attack, t60) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack); g.gain.setTargetAtTime(0, t + attack, t60 / 6.9);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + attack + t60 * 1.15);
  }
  // music-box tine: warm and long at the rim, short and glassy in the middle
  function tine(t, i) {
    const k = i / (N - 1), f = mtof(midiOf(i));
    const out = bus((i % 2 ? 1 : -1) * 0.35 * (1 - 0.5 * k), 0.5);
    out.gain.value = 0.3 + 0.7 * k;
    const len = 1.0 + 2.4 * k;
    partial(out, f, t, 0.6, 0.002, len);
    partial(out, f * 2, t, 0.1, 0.002, len * 0.45);
    partial(out, f * 2.756, t, 0.05 + 0.05 * (1 - k), 0.001, 0.35);
    partial(out, f * 5.4, t, 0.025, 0.0005, 0.05);
  }
  function sub(t) {
    const out = bus(0, 0.3), o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.9);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.55, t + 0.01); g.gain.setTargetAtTime(0, t + 0.01, 0.45);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 3.5);
  }
  function riser(t0, t1) {   // gathers into the line-up and stops dead on it
    const out = bus(0, 0.5);
    const n = ac.createBufferSource(); n.buffer = noise;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.setValueAtTime(400, t0); hp.frequency.exponentialRampToValueAtTime(7000, t1);
    const g = ac.createGain(); g.gain.setValueAtTime(0.001, t0); g.gain.exponentialRampToValueAtTime(0.12, t1 - 0.01); g.gain.linearRampToValueAtTime(0, t1);
    n.connect(hp); hp.connect(g); g.connect(out); n.start(t0, 0.3); n.stop(t1 + 0.02);
    const o = ac.createOscillator(), og = ac.createGain();
    o.frequency.setValueAtTime(mtof(69), t0); o.frequency.exponentialRampToValueAtTime(mtof(93), t1);
    og.gain.setValueAtTime(0.0005, t0); og.gain.exponentialRampToValueAtTime(0.04, t1 - 0.01); og.gain.linearRampToValueAtTime(0, t1);
    o.connect(og); og.connect(out); o.start(t0); o.stop(t1 + 0.02);
  }
  function pad(t0, t1) {     // a quiet bed; whole cycles per loop so it never clicks at the seam
    const out = bus(0, 0.4);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650; lp.connect(out);
    const g = ac.createGain(); g.gain.value = 0.5; g.connect(lp);
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = 2 / T; lg.gain.value = 0.35; lfo.connect(lg); lg.connect(g.gain); lfo.start(t0); lfo.stop(t1);
    for (const m of [45, 52, 57, 60, 64]) {
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = 'triangle'; o.frequency.value = Math.round(mtof(m) * T) / T; og.gain.value = 0.02;
      o.connect(og); og.connect(g); o.start(t0); o.stop(t1);
    }
  }

  let notes = 0;
  for (const c of [-1, 0]) {
    for (let i = 0; i < N; i++) for (let m = 0; m < turns(i); m++) {
      const t = at(c * T + m * T / turns(i));
      if (t < 0) continue;
      tine(t, i); if (c === 0) notes++;
    }
    if (at(c * T) >= 0) sub(at(c * T));
    riser(at(c * T + T - 3.2), at(c * T + T));
  }
  pad(0, LEAD + T);

  const full = await ac.startRendering();
  const from = Math.round(LEAD * SR), len = Math.round(T * SR);
  const chans = [0, 1].map(c => full.getChannelData(c).subarray(from, from + len));
  return { wav: encodeWav(chans, SR), notes };
}
function makeNoise(ac, sec) {
  const b = ac.createBuffer(1, Math.floor(ac.sampleRate * sec), ac.sampleRate), d = b.getChannelData(0), rng = mulberry32(3);
  for (let i = 0; i < d.length; i++) d[i] = rng() * 2 - 1;
  return b;
}
function makeIR(ac, sec) {
  const len = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(2, len, ac.sampleRate), rng = mulberry32(17);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (rng() * 2 - 1) * Math.pow(1 - i / len, 3); }
  return b;
}
function encodeWav(chans, sr) {
  const ch = chans.length, len = chans[0].length;
  let peak = 0;
  for (const d of chans) for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(d[i]));
  const gain = peak > 0 ? 0.89 / peak : 1;
  const bytes = new ArrayBuffer(44 + len * ch * 2), dv = new DataView(bytes);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + len * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true); dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true); str(36, 'data'); dv.setUint32(40, len * ch * 2, true);
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) {
    const x = Math.max(-1, Math.min(1, chans[c][i] * gain));
    dv.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); o += 2;
  }
  const u8 = new Uint8Array(bytes);
  let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
}

window.VIDEO = { FPS, DURATION: T };
window.setAd = ad => { AD = ad; };
window.renderAudio = renderAudio;
window.frameJPEG = t => { drawFrame(t); return cv.toDataURL('image/jpeg', 0.93).split(',')[1]; };
window.framePNG = t => { drawFrame(t); return cv.toDataURL('image/png').split(',')[1]; };
window.ready = document.fonts.load(`900 100px ${FONT}`).then(() => document.fonts.load(`800 50px ${FONT}`))
  .then(() => ({ font: document.fonts.check(`900 100px "Inter Display"`) }));
</script>
</body>
</html>
